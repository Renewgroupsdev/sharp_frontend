<div class="lead-modal">
  <div class="modal-header-custom">
    <div class="modal-title-wrap">
      <div class="title-icon"><i class="bi bi-collection"></i></div>
      <div class="title-content">
        <h2>{{ isEdit ? 'Edit question group' : 'Add question group' }}</h2>
        <p>Related questions that a {{ noun }} can draw from</p>
      </div>
    </div>
    <button type="button" class="modal-close-btn" aria-label="Close" (click)="close()"><i class="bi bi-x-lg"></i></button>
  </div>

  <form (ngSubmit)="save()" novalidate>
    <div class="modal-body-custom">
      <div class="form-field">
        <label for="qg-title">Title <span>*</span></label>
        <div class="input-wrap"><i class="bi bi-fonts"></i>
          <input id="qg-title" name="title" required maxlength="100" [(ngModel)]="title" [class.is-invalid]="submitted() && !title.trim()" placeholder="e.g. Communication — basics" />
        </div>
        @if (submitted() && !title.trim()) { <small class="error-text">Title is required.</small> }
      </div>
    </div>
    <div class="modal-footer-custom">
      <button type="button" class="cancel-btn" (click)="close()">Cancel</button>
      <button type="submit" class="save-btn"><i class="bi bi-floppy"></i> Save</button>
    </div>
  </form>
</div>
