<div class="purchase-page container-fluid px-0">
  <div class="d-flex flex-wrap align-items-center justify-content-between header-actions">
    <p class="page-subtitle">Question groups collect related questions. A quiz draws its questions from the groups chosen in Quiz setup.</p>
    <button *appCan="'a_assess.create'" type="button" class="add-lead-btn" (click)="add()"><i class="bi bi-plus-lg"></i> Add question group</button>
  </div>

  <app-common-filter-card
    searchPlaceholder="Search question groups"
    [showExport]="false"
    (searchChange)="onSearch($event)"
    (filtersChange)="onFiltersChange($event)"
  ></app-common-filter-card>

  <div class="table-col">
    <app-common-table-card
      title="Question groups"
      [recordCountText]="recordCountText"
      [columns]="columns"
      [rows]="rows"
      [totalRecords]="totalRecords"
      [pageSize]="pageSize"
      [pageSizeOptions]="pageSizeOptions"
      [currentPage]="currentPage"
      [pageInfoText]="pageInfoText"
      [sortActive]="sortActive"
      [sortDirection]="sortDirection"
      (pageChange)="onPageChange($event)"
      (sortChange)="onSortChange($event)"
      (quickActionClick)="onQuickAction($event)"
    ></app-common-table-card>
  </div>
</div>
