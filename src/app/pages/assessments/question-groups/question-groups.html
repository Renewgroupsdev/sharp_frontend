<div class="purchase-page container-fluid px-0">
  <p class="page-subtitle grp-note">{{ type === 'Assessment' ? 'Assessment groups collect related questions. An assessment draws its questions from the groups chosen in its setup.' : 'Question groups collect related questions. A quiz draws its questions from the groups chosen in Quiz setup.' }}</p>
  <ng-template appHeaderActions>
    <button *appCan="'a_assess.create'" type="button" class="add-lead-btn" (click)="add()"><i class="bi bi-plus-lg"></i> {{ type === 'Assessment' ? 'Add assessment group' : 'Add question group' }}</button>
  </ng-template>

  <app-common-filter-card
    searchPlaceholder="Search question groups"
    [showExport]="false"
    (searchChange)="onSearch($event)"
    (filtersChange)="onFiltersChange($event)"
  ></app-common-filter-card>

  <div class="table-col">
    <app-common-table-card
      [title]="type === 'Assessment' ? 'Assessment groups' : 'Question groups'"
      [recordCountText]="recordCountText"
      [columns]="columns"
      [rows]="rows"
      [totalRecords]="totalRecords"
      [pageSize]="pageSize"
      [pageSizeOptions]="pageSizeOptions"
      [currentPage]="currentPage"
      [pageInfoText]="pageInfoText"
      [sortActive]="sortActive"
      [sortDirection]="sortDirection"
      (pageChange)="onPageChange($event)"
      (sortChange)="onSortChange($event)"
      (quickActionClick)="onQuickAction($event)"
    ></app-common-table-card>
  </div>
</div>
