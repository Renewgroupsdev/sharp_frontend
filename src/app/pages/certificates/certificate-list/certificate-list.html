<div class="purchase-page container-fluid px-0">
  <ng-template appHeaderActions>
    <button *appCan="'a_certs.create'" type="button" class="add-lead-btn" (click)="add()"><i class="bi bi-plus-lg"></i> Create certificate</button>
  </ng-template>

  <app-count-ribbon class="d-block mb-2" [items]="stats()" [activeKeys]="activeRibbonKeys" (select)="onRibbonSelect($event)" />

  <app-common-filter-card
    searchPlaceholder="Search student, course or certificate ID"
    [filters]="filters"
    [showExport]="false"
    (searchChange)="onSearch($event)"
    (filtersChange)="onFiltersChange($event)"
  ></app-common-filter-card>

  <div class="table-col">
    <app-common-table-card
      title="Certificates"
      [recordCountText]="recordCountText"
      [columns]="columns"
      [rows]="rows"
      [totalRecords]="totalRecords"
      [pageSize]="pageSize"
      [pageSizeOptions]="pageSizeOptions"
      [currentPage]="currentPage"
      [pageInfoText]="pageInfoText"
      [sortActive]="sortActive"
      [sortDirection]="sortDirection"
      (pageChange)="onPageChange($event)"
      (sortChange)="onSortChange($event)"
      (quickActionClick)="onQuickAction($event)"
      (profileClick)="openProfile($event)"
    ></app-common-table-card>
  </div>
</div>
