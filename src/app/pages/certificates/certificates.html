<div class="purchase-page container-fluid px-0">
  <div class="page-header d-flex flex-column flex-md-row align-items-start align-items-md-center justify-content-between">
    <div>
      <h6 class="page-title"><i class="bi bi-award"></i> Certificate Management</h6>
      <p class="page-subtitle">Review, issue, cancel and download course certificates. Set the template and the minimum attendance and score.</p>
    </div>
    <div class="header-actions">
      @if (actions.template(); as t) { <ng-container [ngTemplateOutlet]="t" /> }
    </div>
  </div>

  <div class="tab-bar" role="tablist">
    @for (t of tabs; track t.key) {
      <button type="button" role="tab" class="tab-btn" [class.active]="tab() === t.key" [attr.aria-selected]="tab() === t.key" (click)="tab.set(t.key)">
        <i class="bi" [class]="t.icon"></i> {{ t.label }}
      </button>
    }
  </div>

  <div class="tab-panel">
    @switch (tab()) {
      @case ('templates') { <app-certificate-templates /> }
      @case ('settings') { <app-certificate-settings (openTemplates)="tab.set('templates')" /> }
      @default { <app-certificate-list /> }
    }
  </div>
</div>
