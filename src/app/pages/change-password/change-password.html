<main class="cp">
  <form class="cp-card" (ngSubmit)="submit()" novalidate>
    <span class="cp-ico"><i class="bi bi-shield-lock-fill"></i></span>
    <h1>Create your password</h1>
    <p class="cp-sub">Welcome{{ name ? ', ' + name : '' }}. For your security, set a new password before you continue. You will then sign in again with it.</p>

    <label for="cp-new">New password</label>
    <input id="cp-new" name="next" [type]="show() ? 'text' : 'password'" autocomplete="new-password" minlength="8" [(ngModel)]="next" />

    <label for="cp-again">Confirm new password</label>
    <input id="cp-again" name="again" [type]="show() ? 'text' : 'password'" autocomplete="new-password" [(ngModel)]="again" />

    <div class="cp-row">
      <label class="cp-show"><input type="checkbox" [checked]="show()" (change)="show.set($any($event.target).checked)" /> Show password</label>
      <span class="cp-actions">
        @if (next) { <button type="button" class="cp-link" (click)="copy()">{{ copied() ? 'Copied' : 'Copy' }}</button> }
        <button type="button" class="cp-link" (click)="generate()"><i class="bi bi-magic"></i> Generate password</button>
      </span>
    </div>

    @if (error()) { <p class="cp-err" role="alert">{{ error() }}</p> }

    <button type="submit" class="cp-btn" [disabled]="busy()">{{ busy() ? 'Saving…' : 'Save and sign in again' }}</button>
    <button type="button" class="cp-link cp-out" (click)="signOut()">Sign out</button>
  </form>
</main>
