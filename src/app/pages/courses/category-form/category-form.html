<div class="lead-modal">
  <div class="modal-header-custom">
    <div class="modal-title-wrap">
      <div class="title-icon"><i class="bi bi-tags"></i></div>
      <div class="title-content">
        <h2>{{ isEdit ? 'Edit category' : 'Add category' }}</h2>
        <p>{{ isEdit ? existing?.id : 'Used on the Category field of a course' }}</p>
      </div>
    </div>
    <button type="button" class="modal-close-btn" aria-label="Close" (click)="close()"><i class="bi bi-x-lg"></i></button>
  </div>

  <form #f="ngForm" (ngSubmit)="save(f)" novalidate>
    <div class="modal-body-custom">
      @if (serverError(); as err) { <div class="error-text" role="alert">{{ err }}</div> }
      <div class="form-grid">
        <div class="form-field full-width">
          <label for="cat-name">Category name <span>*</span></label>
          <div class="input-wrap"><i class="bi bi-tag"></i>
            <input id="cat-name" name="n" required maxlength="60" [(ngModel)]="model.n" #name="ngModel" [class.is-invalid]="submitted() && name.invalid" />
          </div>
          @if (submitted() && name.invalid) { <small class="error-text">Category name is required.</small> }
        </div>
        <div class="form-field full-width">
          <label for="cat-desc">Description</label>
          <div class="input-wrap"><textarea id="cat-desc" name="desc" rows="3" maxlength="200" [(ngModel)]="model.desc"></textarea></div>
        </div>
        <div class="form-field full-width">
          <label for="cat-st">Status</label>
          <label class="status-switch" for="cat-st">
            <input id="cat-st" type="checkbox" role="switch" name="st" [checked]="model.st === 'Active'" (change)="model.st = $any($event.target).checked ? 'Active' : 'Inactive'" />
            <span class="track"><span class="thumb"></span></span>
            <span class="status-text">{{ model.st }}</span>
          </label>
        </div>
      </div>
    </div>
    <div class="modal-footer-custom">
      <button type="button" class="cancel-btn" (click)="close()">Cancel</button>
      <button type="submit" class="save-btn" [disabled]="saving()"><i class="bi bi-check-lg"></i> {{ isEdit ? 'Save changes' : 'Add category' }}</button>
    </div>
  </form>
</div>
