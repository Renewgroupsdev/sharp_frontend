<div class="lead-modal">
  <div class="modal-header-custom">
    <div class="modal-title-wrap">
      <div class="title-icon"><i class="bi bi-list-nested"></i></div>
      <div class="title-content">
        <h2>{{ isEdit ? 'Edit module' : 'Add module' }}</h2>
        <p>{{ course?.title }}</p>
      </div>
    </div>
    <button type="button" class="modal-close-btn" aria-label="Close" (click)="close()"><i class="bi bi-x-lg"></i></button>
  </div>

  <form #f="ngForm" (ngSubmit)="save(f)" novalidate>
    <div class="modal-body-custom">
      @if (serverError(); as err) { <div class="error-text" role="alert">{{ err }}</div> }
      <div class="form-grid">
        <div class="form-field full-width">
          <label for="ch-name">Module name <span>*</span></label>
          <div class="input-wrap"><i class="bi bi-fonts"></i>
            <input id="ch-name" name="name" required maxlength="150" [(ngModel)]="model.name" #name="ngModel" [class.is-invalid]="submitted() && name.invalid" />
          </div>
          @if (submitted() && name.invalid) { <small class="error-text">Module name is required.</small> }
        </div>
        <div class="form-field">
          <label for="ch-status">Status</label>
          <div class="input-wrap"><i class="bi bi-toggle-on"></i>
            <select id="ch-status" name="status" [(ngModel)]="model.status">
              <option value="Published">Published</option>
              <option value="Draft">Draft (hidden from learners)</option>
            </select>
            <i class="bi bi-chevron-down select-arrow"></i>
          </div>
        </div>
        <div class="form-field full-width">
          <label for="ch-desc">Description</label>
          <div class="input-wrap"><textarea id="ch-desc" name="desc" rows="3" maxlength="1000" [(ngModel)]="model.desc"></textarea></div>
        </div>
      </div>
    </div>
    <div class="modal-footer-custom">
      <button type="button" class="cancel-btn" (click)="close()">Back</button>
      <button type="submit" class="save-btn"><i class="bi bi-check-lg"></i> {{ isEdit ? 'Save module' : 'Add module' }}</button>
    </div>
  </form>
</div>
