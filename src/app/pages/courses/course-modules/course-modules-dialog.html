<div class="lead-modal">
  <div class="modal-header-custom">
    <div class="modal-title-wrap">
      <div class="title-icon"><i class="bi bi-list-nested"></i></div>
      <div class="title-content">
        <h2>Modules / topics</h2>
        <p>{{ course?.title }} — add chapters, then add lessons inside each chapter.</p>
      </div>
    </div>
    <button type="button" class="modal-close-btn" aria-label="Close" (click)="close()"><i class="bi bi-x-lg"></i></button>
  </div>
  <div class="modal-body-custom">
    <app-course-modules [courseId]="courseId" [readonly]="!canEdit"></app-course-modules>
  </div>
  <div class="modal-footer-custom">
    <button type="button" class="cancel-btn" (click)="close()">Done</button>
  </div>
</div>
