<div class="lead-modal">
  <div class="modal-header-custom">
    <div class="modal-title-wrap">
      <div class="title-icon"><i class="bi bi-person-x"></i></div>
      <div class="title-content">
        <h2>Report absence</h2>
        <p>Tell the programme office why you cannot attend today</p>
      </div>
    </div>
    <button type="button" class="modal-close-btn" aria-label="Close" (click)="close()"><i class="bi bi-x-lg"></i></button>
  </div>

  <form #f="ngForm" (ngSubmit)="save(f)" novalidate>
    <div class="modal-body-custom">
      @if (serverError(); as err) { <div class="error-text" role="alert">{{ err }}</div> }
      <div class="form-grid">
        <div class="form-field full-width">
          <label for="ar-reason">Reason <span>*</span></label>
          <div class="input-wrap"><i class="bi bi-question-circle"></i>
            <select id="ar-reason" name="reason" required [(ngModel)]="model.reason">
              @for (r of reasons; track r) { <option [value]="r">{{ r }}</option> }
            </select>
            <i class="bi bi-chevron-down select-arrow"></i>
          </div>
        </div>
        <div class="form-field full-width">
          <label for="ar-detail">Details {{ detailRequired ? '' : '(optional)' }} @if (detailRequired) { <span>*</span> }</label>
          <div class="input-wrap"><textarea id="ar-detail" name="detail" rows="3" maxlength="200" [(ngModel)]="model.detail" [class.is-invalid]="submitted() && detailRequired && !model.detail.trim()" placeholder="Add anything the reviewer should know"></textarea></div>
          @if (submitted() && detailRequired && !model.detail.trim()) { <small class="error-text">Please describe the reason.</small> }
        </div>
      </div>
    </div>
    <div class="modal-footer-custom">
      <button type="button" class="cancel-btn" (click)="close()">Cancel</button>
      <button type="submit" class="save-btn" [disabled]="saving()"><i class="bi bi-send"></i> Send to admin</button>
    </div>
  </form>
</div>
