<div class="purchase-page container-fluid px-0">
  <div class="page-header d-flex flex-column flex-md-row align-items-start align-items-md-center justify-content-between">
    <div>
      <h6 class="page-title"><i class="bi bi-person-gear"></i> User Management</h6>
      <p class="page-subtitle">Create users with roles — Student, Mentor, Admin, Member, OB, Institution and Super Admin.</p>
    </div>
      <div class="header-actions">
        <button *appCan="'a_users.create'" type="button" class="ghost-btn" (click)="bulkUpload()"><i class="bi bi-upload"></i> Bulk upload</button>
        <button *appCan="'a_users.create'" type="button" class="add-lead-btn" (click)="addUser()"><i class="bi bi-plus-lg"></i> Add user</button>
      </div>
  </div>

  <app-count-ribbon class="d-block mb-2" ariaLabel="Users by role" [items]="stats()" [activeKeys]="activeRibbonKeys" (select)="onRibbonSelect($event)" />


    <app-common-filter-card
      [searchPlaceholder]="searchPlaceholder"
      [filters]="filters"
      [showExport]="true"
      (exportClick)="onExport($event)"
      (searchChange)="onSearch($event)"
      (filtersChange)="onFiltersChange($event)"
    ></app-common-filter-card>

    <div class="table-col">
      <app-common-table-card
        title="Users"
        [recordCountText]="recordCountText"
        [columns]="columns"
        [rows]="rows"
        [totalRecords]="totalRecords"
        [pageSize]="pageSize"
        [pageSizeOptions]="pageSizeOptions"
        [currentPage]="currentPage"
        [pageInfoText]="pageInfoText"
        [sortActive]="sortActive"
        [sortDirection]="sortDirection"
        (pageChange)="onPageChange($event)"
        (sortChange)="onSortChange($event)"
        (quickActionClick)="onQuickAction($event)"
        (profileClick)="open($event)"
      ></app-common-table-card>
    </div>
</div>
