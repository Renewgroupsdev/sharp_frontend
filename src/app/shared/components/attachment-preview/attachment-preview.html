<div class="lead-modal">
  <div class="modal-header-custom">
    <div class="modal-title-wrap">
      <div class="title-icon"><i class="bi bi-file-earmark-text"></i></div>
      <div class="title-content"><h2>{{ data.name }}</h2></div>
    </div>
    <button type="button" class="modal-close-btn" aria-label="Close" (click)="close()"><i class="bi bi-x-lg"></i></button>
  </div>
  <div class="modal-body-custom">
    <app-attachment-viewer [name]="data.name" [size]="data.size ?? ''" [mime]="data.mime ?? null" [load]="data.load" />
  </div>
  <div class="modal-footer-custom">
    <button type="button" class="cancel-btn" (click)="close()">Close</button>
  </div>
</div>
