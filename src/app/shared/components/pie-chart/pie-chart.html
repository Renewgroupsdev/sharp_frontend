<div class="pc">
  <figure class="pc-fig">
    <svg viewBox="0 0 160 160" role="img" [attr.aria-label]="total() + ' ' + unit() + ': ' + summary()">
      @if (total() === 0) {
        <circle cx="80" cy="80" r="76" class="pc-empty-disc" />
        <text x="80" y="78" text-anchor="middle" class="pc-empty-big">0</text>
        <text x="80" y="96" text-anchor="middle" class="pc-empty-small">{{ emptyText() }}</text>
      } @else {
        @for (w of wedges(); track w.label) {
          @if (w.full) {
            <circle cx="80" cy="80" r="76" class="pc-wedge" [style.fill]="w.color"><title>{{ w.label }}: {{ w.value }} ({{ w.percent }}%)</title></circle>
          } @else {
            <path class="pc-wedge" [attr.d]="w.path" [style.fill]="w.color"><title>{{ w.label }}: {{ w.value }} ({{ w.percent }}%)</title></path>
          }
        }
      }
    </svg>
    <figcaption><b>{{ total() }}</b> {{ unit() }}</figcaption>
  </figure>

  <ul class="pc-legend">
    @for (r of rows(); track r.label) {
      <li>
        <i class="pc-dot" [style.background]="r.color"></i>
        <span class="pc-name">{{ r.label }}@if (r.note) { <small>{{ r.note }}</small> }</span>
        <b>{{ r.value }}</b>
        <em>{{ r.percent }}%</em>
      </li>
    }
  </ul>
</div>
