@if (files().length) {
  <ul class="sf">
    @for (f of files(); track f.id) {
      <li>
        <span class="sf-ico" [attr.data-tone]="kind(f.name).tone"><i class="bi" [class]="kind(f.name).icon"></i></span>
        <span class="sf-name"><b>{{ f.name }}</b><small>{{ kind(f.name).label }} · {{ kind(f.name).ext.toUpperCase() }} · {{ sizeOf(f) }}</small></span>
        <span class="sf-actions">
          <button type="button" (click)="view(f)"><i class="bi bi-eye"></i> View</button>
        </span>
      </li>
    }
  </ul>
  @if (error(); as err) { <p class="sf-error" role="alert">{{ err }}</p> }
}
