<section class="wh" aria-label="Welcome">
  <div class="wh-copy">
    <span class="wh-date"><i class="bi bi-calendar3"></i> {{ today }}</span>
    <h1>{{ greeting }}, <em>{{ name() }}</em></h1>
    <p>{{ message() }}</p>

    <ol class="wh-path" aria-label="Learning to placement journey">
      @for (s of steps; track s.label; let last = $last) {
        <li [class.goal]="last"><i class="bi" [class]="s.icon"></i><span>{{ s.label }}</span></li>
      }
    </ol>
  </div>

  <div class="wh-art" aria-hidden="true">
    <svg viewBox="0 0 260 200" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- stack of books -->
      <rect x="40" y="150" width="120" height="18" rx="4" fill="#67e8f9"/>
      <rect x="48" y="132" width="108" height="18" rx="4" fill="#7dd3fc"/>
      <rect x="36" y="114" width="116" height="18" rx="4" fill="#ffffff" fill-opacity=".92"/>
      <rect x="44" y="118" width="4" height="10" rx="2" fill="#0284c7"/>
      <rect x="56" y="136" width="4" height="10" rx="2" fill="#0369a1"/>
      <rect x="50" y="154" width="4" height="10" rx="2" fill="#0e7490"/>
      <!-- graduation cap -->
      <path d="M96 64 L150 42 L204 64 L150 86 Z" fill="#082f49"/>
      <path d="M120 76 V96 C120 104 180 104 180 96 V76 L150 88 Z" fill="#0c4a6e"/>
      <path d="M204 64 V92" stroke="#67e8f9" stroke-width="3" stroke-linecap="round"/>
      <circle cx="204" cy="96" r="5" fill="#67e8f9"/>
      <!-- briefcase -->
      <rect x="176" y="124" width="58" height="44" rx="8" fill="#67e8f9"/>
      <rect x="194" y="116" width="22" height="10" rx="4" stroke="#67e8f9" stroke-width="4"/>
      <rect x="176" y="140" width="58" height="4" fill="#0e7490" fill-opacity=".45"/>
      <!-- sparkles -->
      <path d="M58 60 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 z" fill="#a5f3fc"/>
      <path d="M230 30 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2 z" fill="#bae6fd"/>
      <circle cx="80" cy="96" r="3" fill="#bae6fd"/>
      <circle cx="244" cy="110" r="3" fill="#a5f3fc"/>
    </svg>
  </div>
</section>
