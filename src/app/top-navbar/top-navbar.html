<header class="topbar">
  <button type="button" class="menu-btn" aria-label="Toggle navigation" (click)="nav.toggleSidebar()"><i class="bi bi-list"></i></button>

  <div class="brand">
    <img src="assets/02_Renew%20Group%20-Logo%20only%20png.png" alt="SHARP" class="brand-mark">
  </div>

  <div class="spacer"></div>

  <div class="motto" aria-hidden="true">
    <span><i class="bi bi-book-half"></i> Learn</span>
    <i class="bi bi-chevron-right sep"></i>
    <span><i class="bi bi-patch-check-fill"></i> Certify</span>
    <i class="bi bi-chevron-right sep"></i>
    <span class="hl"><i class="bi bi-briefcase-fill"></i> Get placed</span>
  </div>

  <app-notification-bell></app-notification-bell>

  <div class="account">
    <button type="button" class="profile-btn" title="Edit my profile" aria-label="Edit my profile" (click)="openProfile()">
      @if (auth.actor().pic; as pic) { <img class="avatar avatar-img" [src]="pic" [alt]="auth.actor().n" /> } @else { <span class="avatar" [style.background]="auth.actor().col">{{ auth.actor().i }}</span> }
      <div class="who">
        <strong>{{ auth.actor().n }}</strong>
        <span>{{ auth.role() }}</span>
      </div>
    </button>
    <button type="button" class="logout" title="Sign out" aria-label="Sign out" (click)="auth.logout()"><i class="bi bi-box-arrow-right"></i></button>
  </div>
</header>
